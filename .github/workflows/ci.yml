name: Standard CI

on: 
  workflow_dispatch: 
    inputs:
      deploy_env:
        description: Ambiente onde o deploy será feito
        type: choice
        options:
          - dev
          - staging
          - production
        default: staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "building ..."
  
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "testing ..."
  
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - run: echo "deploying ${{ inputs.deploy_env }} ..."
