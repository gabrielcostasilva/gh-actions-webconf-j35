name: Standard CI

on: 
  workflow_dispatch: 
    inputs:
      deploy_env:
        description: Ambiente onde o deploy será feito
        type: environment
        default: staging
        required: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
  
  test:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.build_result == 'success'
    steps:
      - run: echo "testing ..."
  
  deploy:
    environment: ${{ inputs.deploy_env }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - run: echo "deploying ${{ inputs.deploy_env }} ..."
